<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#c7d9ed" />
    <link rel="icon" href="data:," />
    <title>Iarna Morților</title>
  </head>
  <body>
    <canvas id="game"></canvas>

    <div id="hud" class="hidden">
      <!-- Stânga sus: adăpost + erou -->
      <div class="panel top-left">
        <div class="bar-label">🏠 Adăpost <span id="shelter-text"></span></div>
        <div class="bar"><div id="shelter-bar" class="fill shelter"></div></div>
        <div class="bar-label"><span id="hero-name"></span> <span id="hero-level"></span> <span id="hero-text"></span></div>
        <div class="bar"><div id="hero-bar" class="fill hero"></div></div>
        <div class="bar thin"><div id="xp-bar" class="fill xp"></div></div>
      </div>

      <!-- Sus centru: zi/noapte și cronometrul -->
      <div class="top-center">
        <div class="panel wave-panel">
          <div id="wave-text"></div>
          <div id="timer-text"></div>
          <div class="bar thin"><div id="phase-bar" class="fill phase"></div></div>
          <button id="start-wave" class="small-btn">🌙 Începe noaptea</button>
        </div>
        <div id="boss-panel" class="panel boss-panel hidden">
          <div class="bar-label">☠ Abominația</div>
          <div class="bar"><div id="boss-bar" class="fill boss"></div></div>
        </div>
      </div>

      <!-- Dreapta sus: resurse + magazin + sunet -->
      <div class="top-right">
        <div class="panel resources">
          <div title="Lemn (pentru construcții)">🪵 <span id="wood-text">0</span></div>
          <div title="Monede (pentru magazin)">🪙 <span id="coins-text">0</span></div>
          <div title="Turnuri">🗼 <span id="towers-text">0/0</span></div>
          <div title="Ziduri">🧱 <span id="barricades-text">0/0</span></div>
        </div>
        <div class="corner-buttons">
          <button id="shop-btn" class="round-btn" title="Magazin">🎲</button>
          <button id="mute-btn" class="round-btn" title="Sunet">🔊</button>
        </div>
      </div>

      <!-- Dreapta jos: doar două butoane — trage (și ochește) și construiește -->
      <div class="action-buttons">
        <button id="build-btn" class="action build" title="Construiește (B)">🔨</button>
        <div id="fire-stick" class="fire-stick">
          <div id="fire-knob" class="fire-knob">
            <span class="fire-icon">✛</span>
            <span id="ammo-text" class="ammo-text">0/0</span>
          </div>
          <svg class="reload-ring" viewBox="0 0 100 100"><circle id="reload-arc" cx="50" cy="50" r="46" /></svg>
        </div>
      </div>

      <!-- Paleta de construcție -->
      <div id="build-palette" class="build-bar hidden">
        <div class="bar-title">Ce construiești?</div>
        <button id="pick-tower" class="build-choice"><span class="ico">🗼</span>Turn<small id="tower-cost"></small></button>
        <button id="pick-wall" class="build-choice"><span class="ico">🧱</span>Zid<small id="wall-cost"></small></button>
        <button id="pick-mine" class="build-choice"><span class="ico">💣</span>Mină<small id="mine-cost"></small></button>
        <button id="palette-close" class="build-choice close">✖</button>
      </div>

      <!-- Bara de plasare (turn sau zid) -->
      <div id="place-bar" class="build-bar hidden">
        <span id="place-hint" class="wall-hint"></span>
        <button id="wall-rotate" class="wall-btn">↻ Rotește</button>
        <button id="wall-place" class="wall-btn primary">✔ Pune</button>
        <button id="wall-done" class="wall-btn">✖ Înapoi</button>
      </div>

      <div id="build-banner" class="banner hidden">Atinge un turn/zid de-al tău ca să-l modifici</div>
      <div id="build-menu" class="build-menu hidden"></div>

      <div id="damage" class="damage"></div>
      <div id="toast" class="toast"></div>
      <div id="hint" class="hint"></div>
      <div id="joystick-zone"></div>
    </div>

    <!-- Alegerea eroului -->
    <div id="hero-select" class="overlay">
      <h1>Iarna Morților</h1>
      <p class="subtitle">Alege-ți eroul. Apără adăpostul: familia ta e înăuntru.</p>
      <div id="hero-cards" class="hero-cards"></div>
    </div>

    <!-- Magazinul norocului -->
    <div id="shop-modal" class="overlay hidden">
      <div class="modal shop">
        <header class="shop-head">
          <h2>🎰 Magazinul norocului</h2>
          <div class="shop-wallet">🪙 <span id="shop-coins">0</span></div>
          <button id="shop-close" class="close-btn">✖</button>
        </header>
        <div class="shop-body">
          <section class="shop-machine">
            <div class="reels">
              <div class="reel"><span id="reel-0">🎰</span></div>
              <div class="reel"><span id="reel-1">🎰</span></div>
              <div class="reel"><span id="reel-2">🎰</span></div>
            </div>
            <div id="shop-result" class="shop-result"></div>
            <button id="shop-roll" class="primary-btn"></button>
            <div id="shop-odds" class="odds-bar"></div>
          </section>
          <section class="shop-info">
            <h3>Mai poți câștiga</h3>
            <div id="shop-remaining" class="remaining"></div>
            <h3>Ce ai</h3>
            <div id="shop-stats" class="stats-grid"></div>
          </section>
        </div>
      </div>
    </div>

    <div id="end-screen" class="overlay hidden">
      <h1 id="end-title"></h1>
      <p id="end-text"></p>
      <button id="restart-btn" class="primary-btn">Joacă din nou</button>
    </div>

    <div id="rotate-hint">↻ Rotește telefonul (landscape)</div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
